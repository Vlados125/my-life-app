<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Management WebApp</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- СЕКЦІЯ: ГОЛОВНЕ МЕНЮ -->
    <section id="main-menu" class="screen active">
      <header class="header">
        <h1>Мій Помічник</h1>
        <p>Обирай потрібний розділ</p>
      </header>

      <div class="menu-grid">
        <button class="card-btn" onclick="navigateTo('finance-screen')">
          <span class="icon">📈</span>
          <span class="label">Фінанси та Активи</span>
        </button>
        <button class="card-btn" onclick="navigateTo('nutrition-screen')">
          <span class="icon">🥗</span>
          <span class="label">Харчування</span>
        </button>
      </div>
    </section>

    <!-- СЕКЦІЯ: ФІНАНСИ -->
    <section id="finance-screen" class="screen">
      <header class="screen-header">
        <h2>Фінанси та Активи</h2>
        <div class="total-badge">
          <span>Загальний прибуток</span>
          <h3 id="total-profit-sum">+0.00 € / $</h3>
        </div>
      </header>

      <!-- БЛОК 1: АКЦІЇ -->
      <div class="category-block">
        <h3>📊 Акції (Stocks)</h3>
        <div class="assets-list" id="stocks-list"></div>
      </div>

      <!-- БЛОК 2: КРИПТОВАЛЮТА -->
      <div class="category-block">
        <h3>🪙 Криптовалюта (Crypto)</h3>
        <div class="assets-list" id="crypto-list"></div>
      </div>

      <!-- БЛОК 3: ЩОДЕННИК УГОД -->
      <div class="category-block journal-block">
        <h3>📜 Щоденник угод (Фіксації)</h3>
        <div class="journal-columns">
          <div class="journal-col">
            <h4>📈 Акції</h4>
            <div id="journal-stocks" class="journal-list"></div>
          </div>
          <div class="journal-col">
            <h4>🪙 Криптовалюта</h4>
            <div id="journal-crypto" class="journal-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- СЕКЦІЯ: ХАРЧУВАННЯ (ЗАГОТОВКА) -->
    <section id="nutrition-screen" class="screen">
      <header class="screen-header">
        <h2>Харчування</h2>
      </header>
      <div class="card-placeholder">
        <p>Розділ у розробці...</p>
      </div>
    </section>

    <!-- ЗРУЧНА НИЖНЯ ПАНЕЛЬ НАВІГАЦІЇ -->
    <nav class="bottom-nav">
      <button class="nav-btn" onclick="goBack()">
        <span class="nav-icon">⬅️</span>
        <span class="nav-text">Назад</span>
      </button>
      <button class="nav-btn" onclick="navigateTo('main-menu')">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Головне меню</span>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
